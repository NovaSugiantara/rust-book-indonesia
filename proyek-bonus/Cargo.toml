[package]
name = "shortener"
version = "0.1.0"
edition = "2024"
description = "URL shortener dengan statistik klik, proyek bonus Rust dari Nol"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
