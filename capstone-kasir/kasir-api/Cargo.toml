[package]
name = "kasir-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "REST API Kasir Warung dengan axum, tokio, dan sqlx"

[dependencies]
kasir-core = { path = "../kasir-core" }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

